name: Fork fixture tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-fixtures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Synthetic and native integration fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run synthetic and native fixture tests
        run: bun test --timeout 30000 test/embedding-progress.test.ts test/index.test.ts test/walker.test.ts test/query.test.ts test/rank.test.ts
